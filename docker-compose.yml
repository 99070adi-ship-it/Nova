services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - "5440:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nova:nova@db:5432/nova
      # AI_PROVIDER / NVIDIA_* come from backend/.env (env_file above), not from here: pinning them here would override that file.
      IMAGE_PROVIDER: fake
      JWT_SECRET: dev-secret-change-me-please-32-bytes-minimum
      # Voice: self-hosted Kokoro (no API key). The model is cached in the named volume below so it is
      # downloaded once, not per container. Needs roughly 2 GB RAM free for the voice model.
      TTS_PROVIDER: kokoro
      HF_HOME: /models/huggingface
    volumes:
      - model_cache:/models
    ports:
      - "8100:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
  model_cache:
