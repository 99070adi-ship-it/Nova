[project]
name = "nova-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "email-validator>=2.2,<3",
    "pgvector>=0.3.5,<0.4",
    "argon2-cffi>=23.1,<24",
    "pyjwt>=2.9,<3",
    "openai>=1.51,<2",
    "structlog>=24.4,<25",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
