# Render Blueprint for the NOVA API + database. The two frontends deploy separately on Vercel (see DEPLOY.md).
# In Render: New > Blueprint > select this repo. Render will prompt for every value marked `sync: false`.
# Plans below are "free" so nothing bills by default; free web services sleep when idle and free databases have
# limits, so check Render's current terms and change `plan` for anything beyond a demo.
services:
  - type: web
    name: nova-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    # The image's default CMD does not run migrations, so do it on start. $PORT is provided by Render.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nova-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # unique random value; the API refuses to start in production with the dev secret
      # Browser origins allowed to call the API: the two Vercel apps (update if you add custom domains).
      - key: CORS_ORIGINS
        value: '["https://nova-admin-gules.vercel.app","https://nova-storefront-dusky.vercel.app"]'
      # Admin and API are on different sites (vercel.app vs onrender.com), so the refresh cookie must be SameSite=None.
      - key: COOKIE_SAMESITE
        value: none
      # No voice model on a small instance: build without it (the Guide is text-only). Render passes env vars to
      # the Docker build as build args, which is how WITH_VOICE reaches the Dockerfile.
      - key: WITH_VOICE
        value: "0"
      - key: TTS_PROVIDER
        value: kokoro
      # Assistant / agents (NVIDIA-hosted language model).
      - key: AI_PROVIDER
        value: nvidia
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_CHAT_TEMPLATE_KWARGS
        value: '{"enable_thinking": false}'
      - key: NVIDIA_API_KEY
        sync: false
      # Photo Studio (Cloudflare Workers AI). Token scoped to Workers AI only.
      - key: STUDIO_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: IMAGE_PROVIDER
        value: fake

databases:
  - name: nova-db
    plan: free
    databaseName: nova
    user: nova
